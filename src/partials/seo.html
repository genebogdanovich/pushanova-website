<meta name="apple-itunes-app" content="app-id=6451240468">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<link rel="canonical" href="{{seo.canonical}}">
{{#each seo.hreflangs}}
<link rel="alternate" hreflang="{{code}}" href="{{href}}">
{{/each}}
<meta property="og:locale" content="{{seo.ogLocale}}">
{{#each seo.ogLocaleAlternates}}
<meta property="og:locale:alternate" content="{{this}}">
{{/each}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pushanova">
<meta property="og:url" content="{{seo.canonical}}">
<meta property="og:title" content="{{seo.ogTitle}}">
<meta property="og:description" content="{{seo.ogDescription}}">
<meta property="og:image" content="{{seo.ogImage}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="{{seo.ogImageWidth}}">
<meta property="og:image:height" content="{{seo.ogImageHeight}}">
<meta property="og:image:alt" content="{{seo.ogImageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
{{#if seo.faqJsonLd}}
<script type="application/ld+json">{{seo.faqJsonLd}}</script>
{{/if}}
