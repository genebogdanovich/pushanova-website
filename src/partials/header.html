<header>
  <nav>
    <ul>
      <li>
        <a href="{{urls.home}}"{{#if isHome}} aria-current="page"{{/if}}>
          <img src="{{icon.src}}" alt="" width="{{icon.width}}" height="{{icon.height}}">
          <span>{{nav.home}}</span>
        </a>
      </li>
      <li>
        {{#if isFeatures}}
        <a href="{{urls.features}}" aria-current="page">{{nav.features}}</a>
        {{else}}
        <a href="{{urls.features}}">{{nav.features}}</a>
        {{/if}}
      </li>
      <li>
        {{#if isSupport}}
        <a href="{{urls.support}}" aria-current="page">{{nav.support}}</a>
        {{else}}
        <a href="{{urls.support}}">{{nav.support}}</a>
        {{/if}}
      </li>
    </ul>
  </nav>
</header>
